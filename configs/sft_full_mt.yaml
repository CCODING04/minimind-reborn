# 档二增强 SFT（多轮增强 + 长上下文底座，重训计划阶段 4 合并链）
# 数据 = sft_t2t_mt（sft_t2t 全量 + Belle 中文多轮 30 万，去重去污染后）
# + 训练视图上采样（多轮 ×2 / 深多轮 ×3，有效 674.8 万行、多轮有效占比 41.7%）
# 底座 = 4a 长上下文续训产物（out/pretrain_768.pth，被续训覆盖为新底座）
# 对照档一（sft_full_lc.yaml）：数据增强 + 底座换新，超参不变（控制变量）。
stage: sft
data:
  dataset: sft_t2t_mt
  max_seq_len: 1536
  eval_ratio: 0.003       # 哈希分桶（C5），验证视图不参与上采样
  num_workers: 16         # perf_analysis P2：SFT 编码重尾需要深 worker
train:
  epochs: 2
  batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 1.0e-5   # 与档一一致
  dtype: bf16
  init_from: pretrain     # 续训后的新底座（era1 有 380 旧底座、era2 有档一产物）
  save_interval_steps: 2000
  log_interval: 100
metrics:
  backends: ["tensorboard"]
