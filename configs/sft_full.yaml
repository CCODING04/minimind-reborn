# 64M 全量 SFT（pretrain_t2t 全量 14GB）
stage: sft
data:
  dataset: sft_t2t
  max_seq_len: 768
  eval_ratio: 0.003
  num_workers: 8
train:
  epochs: 2
  batch_size: 16
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-5
  dtype: bf16
  init_from: pretrain
  save_interval_steps: 2000
  log_interval: 100
metrics:
  backends: ["tensorboard"]
