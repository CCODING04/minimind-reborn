stage: distill
data: {dataset: sft_t2t_mini, max_seq_len: 192, eval_ratio: 0.001, eval_iters: 2, num_workers: 2}
train:
  gradient_accumulation_steps: 1
  max_steps: 4
  batch_size: 2
  log_interval: 1
  save_interval_steps: 100
  init_from: null
model: {hidden_size: 64, num_hidden_layers: 2, num_attention_heads: 4, num_key_value_heads: 2}
distill: {teacher_hidden_size: 64, teacher_num_layers: 2, teacher_weight: pretrain, alpha: 0.5, temperature: 1.5}
