# 冒烟：tiny 模型 + 少量步数，验证 pretrain 全链路（testing-quality §3 tiny random model 范式）
stage: pretrain
data: {dataset: pretrain_t2t_mini, max_seq_len: 96, eval_ratio: 0.001, eval_iters: 2, num_workers: 2}
train:
  max_steps: 6
  batch_size: 4
  gradient_accumulation_steps: 2
  log_interval: 2
  save_interval_steps: 100
  seed: 42
model: {hidden_size: 64, num_hidden_layers: 2, num_attention_heads: 4, num_key_value_heads: 2}
