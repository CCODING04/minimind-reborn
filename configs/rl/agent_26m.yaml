# Agent RL：多轮工具调用（mock 工具环境 + 工具对齐/GT 命中奖励）
stage: agent
data:
  dataset: agent_rl_mini
  max_seq_len: 1024
train:
  epochs: 1
  batch_size: 2
  learning_rate: 3.0e-7
  dtype: bf16
  init_from: full_sft
  save_interval_steps: 10
  log_interval: 1
rl:
  num_generations: 4
  max_turns: 3
  max_gen_len: 256
  max_total_len: 2500
  thinking_ratio: 0.1
  loss_type: cispo
