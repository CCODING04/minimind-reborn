# PPO：actor + critic + GAE + KL 早停
stage: ppo
data:
  dataset: rlaif_mini
  max_seq_len: 768
train:
  epochs: 1
  batch_size: 2
  learning_rate: 3.0e-7
  dtype: bf16
  init_from: full_sft
  save_interval_steps: 10
  log_interval: 1
rl:
  num_generations: 1       # PPO 逐样本采样
  clip_epsilon: 0.2
  vf_coef: 0.5
  kl_coef: 0.02
  gamma: 1.0
  lam: 0.95
  ppo_update_iters: 2
  early_stop_kl: 0.25
  mini_batch_size: 2
  critic_learning_rate: 5.0e-7
  max_gen_len: 256
  reward_model_path: ""
