# 64M dense 全量预训练（官方 minimind-3 同构；pretrain_t2t 全量 10GB）
stage: pretrain
data:
  dataset: pretrain_t2t
  max_seq_len: 380        # 官方对 pretrain_t2t 全量的推荐截断
  eval_ratio: 0.003       # 全量数据下 0.3% 尾部切片已足够评估
  num_workers: 8
train:
  epochs: 2
  batch_size: 32
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-4
  dtype: bf16
  save_interval_steps: 2000
  log_interval: 50
metrics:
  backends: ["tensorboard"]   # jsonl 兜底自动追加，双通道记录
