<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>minimind_reborn 试验台</title>
<style>
  :root {
    --bg: #ffffff; --bg2: #f6f8fa; --border: #d1d9e0; --fg: #1f2328; --muted: #59636e;
    --link: #0969da; --green: #1a7f37; --danger: #cf222e; --code: rgba(129,139,152,.16);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.6 -apple-system, "Segoe UI", "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
         color: var(--fg); background: var(--bg); display: flex; height: 100vh; }

  /* ===== 侧栏 ===== */
  aside { width: 288px; min-width: 288px; border-right: 1px solid var(--border); background: var(--bg2);
          display: flex; flex-direction: column; overflow-y: auto; }
  aside h1 { font-size: 15px; margin: 0; padding: 14px 16px 2px; }
  aside .sub { font-size: 12px; color: var(--muted); padding: 0 16px 10px; border-bottom: 1px solid var(--border); }
  .sec-title { font-size: 12px; font-weight: 600; color: var(--muted); padding: 12px 16px 4px; text-transform: uppercase; }
  .model-list { padding: 0 8px; }
  .model-item { display: flex; align-items: flex-start; gap: 8px; padding: 7px 8px; border-radius: 6px; cursor: pointer; }
  .model-item:hover { background: #eaeef2; }
  .model-item input { margin-top: 3px; }
  .model-item .meta { flex: 1; }
  .model-item .name { font-weight: 600; font-size: 13px; }
  .model-item .desc { font-size: 11.5px; color: var(--muted); }
  .badge { display: inline-block; font-size: 10.5px; padding: 0 6px; border-radius: 10px;
           border: 1px solid var(--border); background: #fff; color: var(--muted); margin-left: 4px; }
  .badge.b-green { color: var(--green); border-color: var(--green); }

  /* ===== 参数 ===== */
  .params { padding: 4px 16px 8px; }
  .param { margin: 8px 0; }
  .param label { display: flex; justify-content: space-between; font-size: 12.5px; }
  .param label output { color: var(--link); font-family: ui-monospace, monospace; }
  .param input[type=range] { width: 100%; accent-color: var(--link); }
  .switches { padding: 0 16px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .switches label { display: flex; gap: 8px; align-items: center; cursor: pointer; }

  /* ===== 主区 ===== */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #columns { flex: 1; overflow-y: auto; padding: 18px; display: flex; gap: 14px; align-items: stretch; }
  .col { flex: 1; min-width: 0; border: 1px solid var(--border); border-radius: 8px; display: flex; flex-direction: column; background: var(--bg); }
  .col-head { padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--bg2);
              font-size: 12.5px; display: flex; justify-content: space-between; align-items: center; }
  .col-head .tag { font-family: ui-monospace, monospace; color: var(--link); font-weight: 600; }
  .col-head .stat { color: var(--muted); font-size: 11.5px; }
  .col-body { flex: 1; overflow-y: auto; padding: 12px; white-space: pre-wrap; word-break: break-word; font-size: 13.5px; }
  .col-body .msg-user { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
                        padding: 8px 10px; margin: 0 0 10px; color: var(--fg); }
  .col-body .msg-user::before { content: "提问"; display: block; font-size: 10.5px; color: var(--muted); margin-bottom: 2px; }
  .col-body .cursor::after { content: "▍"; color: var(--link); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .empty { margin: auto; color: var(--muted); text-align: center; }
  .empty .hint { font-size: 12.5px; margin-top: 6px; }

  /* ===== 输入区 ===== */
  #composer { border-top: 1px solid var(--border); padding: 12px 18px; background: var(--bg2); }
  #prompt { width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--border); border-radius: 8px;
            padding: 10px 12px; font: inherit; }
  #prompt:focus { outline: 2px solid var(--link); outline-offset: -1px; }
  .composer-row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .composer-row .left { font-size: 12px; color: var(--muted); }
  button.primary { background: var(--link); color: #fff; border: none; border-radius: 6px;
                   padding: 7px 20px; font: inherit; font-weight: 600; cursor: pointer; }
  button.primary:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px;
                 font: inherit; font-size: 12.5px; color: var(--muted); cursor: pointer; }
  #status { font-size: 12px; color: var(--muted); padding: 4px 18px 8px; min-height: 20px; }
  .thinking { color: var(--muted); }
</style>
</head>
<body>
<aside>
  <h1>minimind_reborn 试验台</h1>
  <div class="sub">训练成果推理对比 · 阶段切换按需加载</div>
  <div class="sec-title">模型（勾选 1 个对话 / 多个对比）</div>
  <div class="model-list" id="models">加载中…</div>
  <div class="sec-title">生成参数</div>
  <div class="params" id="params"></div>
  <div class="switches">
    <label><input type="checkbox" id="use_best"> 使用 best 权重（验证集最优）</label>
    <label><input type="checkbox" id="pretrain_mode"> base 直拼模式（pretrain 权重建议开启）</label>
    <label><input type="checkbox" id="open_thinking"> 开启 &lt;think&gt; 思考前缀</label>
  </div>
</aside>

<main>
  <div id="columns">
    <div class="empty" id="empty-hint">
      <div>← 在左侧勾选模型开始</div>
      <div class="hint">勾选 1 个：多轮对话 · 勾选多个：同题对比</div>
    </div>
  </div>
  <div id="status"></div>
  <div id="composer">
    <textarea id="prompt" placeholder="输入问题（Ctrl+Enter 发送）…">推荐两道中国菜并说明做法</textarea>
    <div class="composer-row">
      <div class="left">对比模式按顺序加载模型生成，切换加载约需数秒</div>
      <div>
        <button class="ghost" id="btn-clear">清空对话</button>
        <button class="primary" id="btn-send">发送</button>
      </div>
    </div>
  </div>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const PARAM_DEFS = [
  ["temperature", "温度（≤0 = 贪心）", 0, 2, 0.05, 0.7],
  ["top_p", "top-p 核采样", 0, 1, 0.05, 0.9],
  ["top_k", "top-k（0 关闭）", 0, 100, 1, 50],
  ["repetition_penalty", "重复惩罚", 1.0, 1.5, 0.05, 1.0],
  ["max_new_tokens", "最大新 token 数", 32, 1024, 32, 256],
];
let selected = [];       // 有序：勾选顺序即对比顺序
let history = [];        // 单模型对话历史
let busy = false;

function renderParams() {
  $("params").innerHTML = PARAM_DEFS.map(([k, label, min, max, step, def]) => `
    <div class="param">
      <label>${label}<output id="out-${k}">${def}</output></label>
      <input type="range" id="p-${k}" min="${min}" max="${max}" step="${step}" value="${def}"
             oninput="document.getElementById('out-${k}').value=this.value">
    </div>`).join("");
}
function genParams() {
  const o = {};
  for (const [k] of PARAM_DEFS) o[k] = parseFloat($("p-" + k).value);
  return o;
}

async function loadModels() {
  const models = await (await fetch("/api/models")).json();
  const stageLabel = { pretrain: "预训练 base", sft: "SFT 对话", dpo: "DPO 对齐",
                       distill: "蒸馏", grpo: "GRPO", ppo: "PPO", agent: "Agent RL" };
  $("models").innerHTML = models.map((m) => `
    <label class="model-item">
      <input type="checkbox" value="${m.model_id}" onchange="onPick(this)">
      <span class="meta">
        <span class="name">${m.model_id}</span><span class="badge">${stageLabel[m.stage] || m.stage}</span>
        ${m.has_best ? '<span class="badge b-green">best</span>' : ""}
        <div class="desc">${m.recipe_name} · ${m.trained_at} · ${m.hidden_size}d${m.use_moe ? " · MoE" : ""}</div>
      </span>
    </label>`).join("") || "未发现模型产物";
}
function onPick(box) {
  if (box.checked) selected.push(box.value);
  else selected = selected.filter((v) => v !== box.value);
  renderColumns();
}
function renderColumns() {
  $("empty-hint").style.display = selected.length ? "none" : "";
  const existing = new Map([...document.querySelectorAll(".col")].map((c) => [c.dataset.mid, c]));
  $("columns").innerHTML = "";
  for (const mid of selected) {
    const col = existing.get(mid) || newColumn(mid);
    $("columns").appendChild(col);
  }
}
function newColumn(mid) {
  const col = document.createElement("div");
  col.className = "col"; col.dataset.mid = mid;
  col.innerHTML = `<div class="col-head"><span class="tag">${mid}</span><span class="stat"></span></div>
                   <div class="col-body"></div>`;
  return col;
}
function body(mid) { return document.querySelector(`.col[data-mid="${mid}"] .col-body`); }
function stat(mid) { return document.querySelector(`.col[data-mid="${mid}"] .stat`); }

function addQuestion(text) {
  history.push({ role: "user", content: text });
  for (const mid of selected) {
    const b = body(mid);
    const div = document.createElement("div");
    div.className = "msg-user"; div.textContent = text;
    b.appendChild(div);
    const ans = document.createElement("div");
    ans.className = "answer cursor"; ans.dataset.mid = mid;
    b.appendChild(ans);
  }
}
function setAnswerEl(mid, el) {
  const cur = body(mid).querySelector(`.answer[data-mid="${mid}"].cursor`);
  if (cur) cur.remove();
  const ans = document.createElement("div");
  ans.className = "answer"; ans.textContent = el;
  body(mid).appendChild(ans);
}

async function send() {
  if (busy || !selected.length) return;
  const text = $("prompt").value.trim();
  if (!text) return;
  busy = true; $("btn-send").disabled = true;
  $("status").textContent = "生成中…（按需加载：多模型顺序切换）";
  addQuestion(text);
  const pretrainMode = $("pretrain_mode").checked && selected.every((m) => m.startsWith("pretrain"));

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model_ids: selected, use_best: $("use_best").checked,
        messages: pretrainMode ? [{ role: "user", content: text }] : history,
        pretrain_mode: pretrainMode, open_thinking: $("open_thinking").checked,
        gen: genParams(),
      }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.detail || resp.statusText);
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    const answers = {};   // mid -> 累积文本
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, idx); buf = buf.slice(idx + 2);
        if (!line.startsWith("data: ")) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.type === "delta") {
          answers[ev.model_id] = (answers[ev.model_id] || "") + ev.text;
          const el = body(ev.model_id).querySelector(".answer.cursor");
          if (el) {
            const [main, ...rest] = splitThink(answers[ev.model_id]);
            el.innerHTML = "";
            if (main) el.appendChild(document.createTextNode(main));
            if (rest) { const t = document.createElement("span"); t.className = "thinking"; t.textContent = rest; el.appendChild(t); }
            el.classList.add("cursor");
          }
        } else if (ev.type === "done") {
          setAnswerEl(ev.model_id, ev.content);
          stat(ev.model_id).textContent = `${ev.latency_ms}ms · ${ev.tokens_per_s} tok/s`;
        } else if (ev.type === "error") {
          setAnswerEl(ev.model_id, "⚠ " + ev.message);
        } else if (ev.type === "model_start") {
          stat(ev.model_id).textContent = "加载/生成中…";
        }
      }
    }
    // 单模型对话模式：把回答并入历史，支持多轮
    if (selected.length === 1) {
      const last = [...document.querySelectorAll(`.col[data-mid="${selected[0]}"] .answer`)].pop();
      history.push({ role: "assistant", content: last ? last.textContent : "" });
    }
    $("status").textContent = "";
  } catch (e) {
    $("status").textContent = "出错：" + e.message;
  } finally {
    for (const el of document.querySelectorAll(".answer.cursor")) el.classList.remove("cursor");
    busy = false; $("btn-send").disabled = false;
  }
}
function splitThink(text) {
  if (text.includes("</think>")) {
    const [think, rest] = text.split("</think>", 2);
    return [rest.trim(), "💭 " + think.replace(/<think>/, "").trim()];
  }
  return [text, null];
}

$("btn-send").onclick = send;
$("btn-clear").onclick = () => { history = []; for (const mid of selected) body(mid).innerHTML = ""; };
$("prompt").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
});
renderParams();
loadModels();
</script>
</body>
</html>
